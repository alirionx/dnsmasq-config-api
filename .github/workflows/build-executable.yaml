name: Build Python App with Nuitka

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      
      - name: Install nodejs dependencies
        run: |
          cd spa
          npm install
          npm run build
          mkdir -p ../src/static
          cp -R dist/* ../src/static

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build executable with Nuitka
        run: |
          nuitka \
            --onefile \
            --standalone \
            --include-data-dir=./src/static=static \
            --follow-imports \
            --output-dir=./build \
            --output-filename=dnsmasq-config-api \
            ./src/app.py
        
        # For testing porpose
        # run: |
        #   mkdir ./build
        #   echo "test" > ./build/dnsmasq-config-api

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-app-binary
          path: ./build/dnsmasq-config-api

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: python-app-binary
          path: ./downloads
      
      - name: list downloaded files
        run: ls -lah ./downloads
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
